<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <form action = "register_account.html" method = "post" id = "registration_form">
        <fieldset>
            <legend>Registration Information</legend>
            <label for = "email">E-Mail:</label>
            <input type = "email" name = "email" id = "email"
            autofocus required autoacomplete = "on"><br>
            <label for = "password">Password</label>
            <input type = "password" name = "password" id = "password" required
               placeholder="At least 6 letters or numbers"
               pattern="[a-zA-Z0-9]{6,}"
               title = "Must be at least 6 alphanumeric characters"><br>
               <label for = "verify" >Verify Password:</label>
               <input type = "password" name = "verify" id = "verify" required><br>
        </fieldset>


    <fieldset> 
        <legend>Member Information</legend> 
        <label for="first_name">First Name:</label> 
        <input type="text" name="first_name" id="first_name" 
            required autocomplete="on"><br>         
        <label for="state">State:</label> 
        <input type="text" name="state" id="state" required  
            maxlength="2"  
            placeholder="2-character code" 
            autocomplete="on"><br> 
        <label for="zip">ZIP Code:</label> 
        <input type="text" name="zip" id="zip" required 
            placeholder="5 or 9 digits"  
            pattern="^\d{5}(-\d{4})?$" 
            title="Either 5 or 9 digits" 
            autocomplete="on"><br> 
        <label for="phone">Phone Number:</label> 
        <input type="tel" name="phone" id="phone" 
            placeholder="999-999-9999"  
            pattern="\d{3}[\-]\d{3}[\-]\d{4}"  
            title="Must be 999-999-999 format" 
            autocomplete="on"><br> 
    </fieldset> 
    
        <!--Add a <fieldset> for Membership Information along with other elements as shown in the screenshot.  
The Membership Type Drop-down Box includes Junior, Regular, and Charter. 
Make the Starting Date a required field. 
The Tickets input type should be “number”. Min should be 1 and Max should be 4. Default value should be 2. -->

        <fieldset>
        <legend>Member Information</legend>
        <label for = "Membership Type">Membership Type:</label>
        <select name = "Membership Type" id = "Membership Type">
            <option value = "Junior">Junior</option>
            <option value = "Regular">Regular</option>
            <option value = "Charter">Charter</option>
</select><br>
        <label for = "Starting Date">Starting Date:</label>
        <input type = "date" name = "Starting Date" id = "Starting Date" required><br>
        <label for = "Tickets">Tickets:</label>
        <input type = "number" name = "Tickets" id = "Tickets" min = "1" max = "4" value = "2"><br>
</fieldset>
<fieldset>
    <legend>How Did You Hear About Us?</legend>

    <input type = "checkbox" id = "search_engine" name = "howdid" value = "search">
    <label for = "search_engine">Search Engine</label><br>
    
     <input type = "checkbox" id = "social_media" name = "howdid" value = "social">
    <label for = "search engine">Social Media</label><br>

     <input type = "checkbox" id = "Email" name = "howdid" value = "Email">
    <label for = "search engine">Email</label><br>

     <input type = "checkbox" id = "friend" name = "howdid" value = "friend">
    <label for = "friend">Friend or colleague</label><br>
    
</fieldset>
<fieldset>
    <legend>Comments: </legend>
    <label for = "Comments">Comments</label>
    <textarea name = "Comments" id = "Comments" rows = "5" cols = "40" placeholder="If you have any comments, please enter them here."></textarea><br>
</fieldset>
    <input type = "submit" value = "Submit">
    <input type = "reset" value = "Reset Fields">
    </form>

</body>
</html>
